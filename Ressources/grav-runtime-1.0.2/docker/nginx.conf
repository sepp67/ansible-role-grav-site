user www-data;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;

    access_log /dev/stdout;
    error_log /dev/stderr;

    server {
        listen 80;
        server_name _;

        root /var/www/html;
        index index.php index.html;

        client_max_body_size 64M;

        # Internal liveness endpoint used by the Docker HEALTHCHECK. Goes
        # through PHP-FPM but never through Grav's own front controller, so
        # it never depends on a particular site's content or theme.
        location = /healthz {
            try_files /healthz.php =404;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index healthz.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root/healthz.php;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Never serve dotfiles (.git, .env, leftover .htaccess, ...).
        location ~ /\. {
            deny all;
        }

        # Grav internals that must never be reachable directly.
        location ~* ^/(cache|bin|logs|backup|tests|webserver-configs)/ {
            deny all;
        }

        # Accounts, runtime config and data must never be served as static
        # files, whatever they contain (secrets, hashed passwords, etc.).
        location ~* ^/user/(config|accounts|data)/ {
            deny all;
        }

        # Config/template/script source files should never be served raw,
        # wherever they live under the webroot.
        location ~* \.(yaml|yml|twig|md|sh|env)$ {
            deny all;
        }

        # Only the front controller and the healthcheck script may execute;
        # no other .php file under the webroot (theme/plugin internals,
        # vendor code) is directly reachable.
        location ~ ^/(index|healthz)\.php$ {
            try_files $uri =404;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }

        location ~ \.php$ {
            deny all;
        }
    }
}
