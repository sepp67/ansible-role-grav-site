[www]
user = www-data
group = www-data

listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

clear_env = no

; Access/error logging for this pool goes to stdout/stderr via the base
; php image's own /usr/local/etc/php-fpm.d/docker.conf (error_log,
; access.log and catch_workers_output are already set there) — not
; repeated here to avoid two files disagreeing on the same setting.

; To override any of the settings above without rebuilding this image,
; replace this file wholesale (bind-mount your own file over
; /usr/local/etc/php-fpm.d/www.conf, or COPY a replacement in a derived
; image) — php-fpm does not merge multiple partial definitions of the
; same pool across files.
