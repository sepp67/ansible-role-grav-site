---
name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Installer Ansible et ansible-lint
        run: |
          pip install "ansible-core>=2.17,<2.18"
          pip install ansible-lint
      - name: Installer les dépendances du rôle
        run: ansible-galaxy collection install -r requirements.yml
      - name: ansible-lint
        # playbooks/, inventories/ et examples/ passés explicitement : non
        # découverts automatiquement dans un dépôt qui EST un rôle (voir
        # README.md "Tests").
        run: ansible-lint . playbooks/ inventories/ examples/

  static-checks:
    # Vérifications statiques de la couche autonome (playbooks/,
    # inventories/) qui n'ont pas besoin de Docker — indépendantes du job
    # "test" ci-dessous.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Installer Ansible
        run: pip install "ansible-core>=2.17,<2.18"
      - name: Installer les dépendances du rôle
        run: ansible-galaxy collection install -r requirements.yml
      - name: "Syntaxe des playbooks autonomes"
        run: |
          for p in playbooks/*.yml; do
            ansible-playbook --syntax-check -i inventories/example/hosts.yml "$p"
          done
      - name: "Validité de l'inventaire d'exemple"
        run: ansible-inventory -i inventories/example/hosts.yml --list >/dev/null
      - name: "T01 — Validation des variables du rôle (aucun Docker requis)"
        run: |
          cd tests
          ansible-playbook -i inventory test_assertions.yml
      - name: "T20/T23 — Traçabilité structurée (aucun Docker, sans gather_facts)"
        run: |
          cd tests
          ansible-playbook -i inventory test_traceability.yml
      - name: "Cycle de vie de .last_failure.log (aucun Docker)"
        run: |
          cd tests
          ansible-playbook -i inventory test_failure_log_lifecycle.yml
      - name: "T09/T10/T11 — matrice de protection administrateur (aucun Docker)"
        run: |
          cd tests
          ansible-playbook -i inventory test_admin_guard.yml
      - name: "Persistance intacte après les gardes administrateur (aucun Docker)"
        run: |
          cd tests
          ansible-playbook -i inventory test_persistence_untouched.yml
      - name: "T22 — consommation via requirements.yml depuis un projet tiers (aucun Docker)"
        run: |
          cd tests
          ansible-playbook -i inventory test_consume_via_requirements.yml
      - name: "Audit de non-fuite des secrets (aucun Docker)"
        run: |
          cd tests
          ansible-playbook -i inventory test_no_secret_leak.yml
      - name: "grav_version de l'exemple jamais 'latest'"
        run: |
          ! grep -E '^\s*grav_version:\s*"?latest"?\s*$' \
            inventories/example/group_vars/grav_servers/main.yml
      - name: "Aucun vault.yml réel commité (seul vault.yml.example doit exister)"
        run: |
          ! git ls-files | grep -E '(^|/)vault\.yml$'
          test -f inventories/example/group_vars/grav_servers/vault.yml.example
      - name: "Aucune référence à Control Repository ou à un chemin de développement local"
        run: |
          ! grep -rniE 'control[_-]repo|/home/[a-z]+/' \
            --include='*.yml' --include='*.yaml' --include='*.cfg' --include='Makefile' \
            --exclude-dir=Ressources --exclude-dir=.git .
      - name: "Aucun lien symbolique suivi pointant hors du dépôt"
        run: |
          fail=0
          for path in $(git ls-files -s | awk '$1=="120000"{print $4}'); do
            tgt="$(git show ":$path")"
            case "$tgt" in
              /* | ../* | */../* )
                echo "::error::lien symbolique hors du dépôt : $path -> $tgt"
                fail=1 ;;
            esac
          done
          exit $fail
      - name: "Aucune adresse de VM privée (RFC 1918) dans inventories/"
        run: |
          ! grep -rnE 'ansible_host:[[:space:]]*(10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.)' \
            inventories/
      - name: "Les renvois « voir README » du code pointent une section existante"
        run: |
          missing=0
          grep -rh 'README' \
            --include='*.yml' --include='*.yaml' --include='*.cfg' --include='*.j2' --include='Makefile' \
            -- tasks/ playbooks/ templates/ tests/ defaults/ inventories/ examples/ ansible.cfg Makefile \
            | grep -viE 'grav-?runtime *README|README de' \
            | grep -oE 'README(\.md)?[ ,]*[«"][^«"»]+[»"]' \
            | sed -E 's/.*[«"]([^«"»]+)[»"]/\1/; s/^ +//; s/ +$//' \
            | sort -u > anchors.txt
          while IFS= read -r a; do
            [ -z "$a" ] && continue
            grep -qF "$a" README.md \
              || { echo "::error::section README.md manquante : « $a »"; missing=1; }
          done < anchors.txt
          rm -f anchors.txt
          exit $missing

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Installer Ansible
        run: pip install "ansible-core>=2.17,<2.18"
      - name: Installer les dépendances du rôle
        run: ansible-galaxy collection install -r requirements.yml
      - name: Test fonctionnel (Docker déjà présent sur le runner GitHub Actions)
        run: |
          cd tests
          ansible-playbook -i inventory test.yml
      - name: Test de l'encodage des caractères spéciaux dans grav.env
        run: |
          cd tests
          ansible-playbook -i inventory test_env_encoding.yml
      - name: "Test fonctionnel de la couche autonome (playbooks/deploy.yml, check.yml, restart.yml, stop.yml)"
        run: |
          cd tests
          ansible-playbook -i inventory test_standalone.yml

  molecule-install:
    # T02 / T03 — installation de Docker + idempotence sur les trois
    # plateformes supportées (conteneurs privilégiés + systemd, sans Docker
    # préinstallé). Le runner GitHub Actions autorise --privileged.
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: "Installer Molecule + le driver Docker (requirements-test.txt)"
        run: |
          pip install -r requirements-test.txt
          ansible-galaxy collection install 'community.docker:>=3.10.2' 'ansible.posix:>=1.4.0'
      - name: "molecule test -s install (Debian 12, Ubuntu 22.04, Ubuntu 24.04)"
        run: molecule test -s install

  molecule-deploy:
    # T09–T16 — déploiement fonctionnel réel (bootstrap admin, réseau,
    # verdict de santé, .last_failure.log) en Docker-in-Docker (Debian 12).
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: "Installer Molecule + le driver Docker"
        run: |
          pip install -r requirements-test.txt
          ansible-galaxy collection install 'community.docker:>=3.10.2' 'ansible.posix:>=1.4.0'
      - name: "molecule test -s deploy"
        run: molecule test -s deploy

  molecule-pull:
    # T17 / T18 — politique de pull missing / always : redémarrage sans
    # consultation du registre, grav_force_pull → tentative réelle de pull.
    # Docker-in-Docker (Debian 12).
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: "Installer Molecule + le driver Docker"
        run: |
          pip install -r requirements-test.txt
          ansible-galaxy collection install 'community.docker:>=3.10.2' 'ansible.posix:>=1.4.0'
      - name: "molecule test -s pull"
        run: molecule test -s pull

  molecule-digest:
    # T19 / T20 / T23 — déploiement par digest, traçabilité structurée sur un
    # déploiement réel, rôle joué avec gather_facts: false. DinD (Debian 12).
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: "Installer Molecule + le driver Docker"
        run: |
          pip install -r requirements-test.txt
          ansible-galaxy collection install 'community.docker:>=3.10.2' 'ansible.posix:>=1.4.0'
      - name: "molecule test -s digest"
        run: molecule test -s digest

  molecule-multi-instance:
    # T21 — deux invocations du rôle dans un même playbook sur le même hôte ;
    # isolation (conteneurs, projets Compose, ports, volumes, comptes, état).
    # DinD (Debian 12).
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: "Installer Molecule + le driver Docker"
        run: |
          pip install -r requirements-test.txt
          ansible-galaxy collection install 'community.docker:>=3.10.2' 'ansible.posix:>=1.4.0'
      - name: "molecule test -s multi_instance"
        run: molecule test -s multi_instance
