---
# Redémarre le conteneur d'un site déjà déployé (même image/version) — ce
# playbook ne fait que transmettre grav_state: restarted au rôle ; le
# healthcheck et la vérification HTTP réelle s'exécutent ensuite comme pour
# tout déploiement (tasks/main.yml : when: grav_state != 'stopped').
#
# Le rôle est référencé par chemin relatif (voir README.md "Résolution du
# rôle") ; `# noqa: role-name[path]` : choix délibéré, pas un oubli.
#
# Usage (depuis la racine du dépôt) — un inventaire explicite est requis :
#   ansible-playbook -i <votre-inventaire> playbooks/restart.yml

- name: "Préflight autonome — un inventaire ciblant grav_servers doit être fourni explicitement"
  hosts: localhost
  gather_facts: false
  tasks:
    - name: "Refuser de continuer si aucun hôte 'grav_servers' n'est défini"
      ansible.builtin.assert:
        that:
          - groups.get('grav_servers', []) | length > 0
        fail_msg: >-
          Ce dépôt ne cible aucune VM par défaut. Fournissez explicitement
          votre inventaire :
          ansible-playbook -i <votre-inventaire> playbooks/restart.yml
          (voir README.md, « Utilisation autonome »).
        quiet: true

- name: "Redémarrer un site Grav déployé"
  hosts: grav_servers
  become: true
  roles:
    - role: "{{ playbook_dir }}/.."  # noqa: role-name[path]
      vars:
        grav_state: restarted
