[defaults]
# Ce dépôt EST le rôle (tasks/, defaults/, templates/, meta/ à sa racine) :
# les playbooks sous playbooks/ le référencent par CHEMIN RELATIF à
# eux-mêmes ("{{ playbook_dir }}/.."), jamais par son nom — vérifié
# empiriquement indépendant du nom du dossier sous lequel ce dépôt a été
# cloné (voir README.md "Résolution du rôle"). roles_path ci-dessous ne
# sert donc jamais à résoudre CE rôle : il n'est là que pour un éventuel
# rôle tiers ajouté un jour via requirements.yml.
roles_path = ./roles

# Permet de lancer `ansible-playbook playbooks/deploy.yml` sans `-i` depuis
# la racine du dépôt. Un opérateur reste libre de cibler un autre inventaire
# avec `-i`.
inventory = inventories/production/hosts.yml

# Un déploiement interrompu ne doit pas laisser de *.retry à la racine du
# dépôt (voir .gitignore) : autant ne jamais en générer.
retry_files_enabled = False

# Résultats de tâches lisibles (YAML), sans dépendre d'une collection
# supplémentaire non déclarée dans requirements.yml.
callback_result_format = yaml

# La vérification des clés hôtes SSH reste activée (comportement par défaut
# d'Ansible, volontairement non modifié ici) : ce dépôt déploie sur des
# hôtes réels, à la différence de tests/ansible.cfg (localhost uniquement,
# où host_key_checking=False est explicitement justifié). Un opérateur doit
# accepter une fois la clé hôte d'une VM cible (connexion SSH manuelle ou
# ssh-keyscan) avant le premier déploiement — voir README.md "Préflight".

[ssh_connection]
pipelining = True
