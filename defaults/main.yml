---
# Identité de l'application déployée — les deux seules variables qui doivent
# changer pour déployer une application différente basée sur grav-runtime.
grav_image: ""
grav_version: ""

# Épinglage immuable OPTIONNEL. Vide : la référence déployée est
# "grav_image:grav_version" et l'exploitation dépend de la convention de
# non-réécriture des tags. Renseigné ("sha256:" + 64 hexa) : la référence
# devient "grav_image@grav_digest" — identité de l'image garantie.
# grav_version reste obligatoire dans les deux cas (label humain).
# Fortement recommandé pour une VM durable. Voir README.md et
# docs/MIGRATION.md §4.
grav_digest: ""

# Nom du conteneur / service docker compose, et racine de l'instance sur
# l'hôte. Une instance = un répertoire.
grav_container_name: "grav-site"
grav_base_directory: "/opt/grav-site/{{ grav_container_name }}"

# Réseau. Le rôle ne gère jamais de reverse proxy ni de TLS. Adresse d'écoute
# OBLIGATOIRE (contrat v1.0.1 §7.1) : aucune valeur implicite, l'appelant
# doit exprimer son intention — "127.0.0.1" (usage strictement local),
# l'adresse LAN IPv4 de la VM (cas normal d'une instance durable), ou
# "0.0.0.0" (toutes les interfaces, choix assumé). v2.0.0 : IPv4 uniquement
# (IPv6 refusée — voir docs/MIGRATION.md). Voir README.md "Contrat réseau".
grav_bind_address: ""
grav_http_port: 8080

grav_restart_policy: "unless-stopped"

# Répertoires persistants — voir README.md "grav-runtime" pour le contrat :
# ce sont les 4 seuls sous-répertoires de user/ que le runtime traite comme
# persistants et montables séparément.
grav_pages_directory: "{{ grav_base_directory }}/data/pages"
grav_accounts_directory: "{{ grav_base_directory }}/data/accounts"
grav_data_directory: "{{ grav_base_directory }}/data/data"
grav_images_directory: "{{ grav_base_directory }}/data/images"

# Fichiers secrets (ex. security-private.php, email-private.php), montés
# individuellement en lecture seule sous user/config/. Jamais générés par le
# rôle : chaque entrée fournit soit un fichier source (`src`, sur le
# contrôleur, typiquement chiffré avec ansible-vault), soit un contenu
# inline (`content`, à vaultiser dans les variables du rôle).
#
# grav_secrets:
#   - name: security-private.php
#     src: "{{ inventory_dir }}/files/security-private.php"
#   - name: email-private.php
#     content: "{{ vaulted_email_private_php }}"
grav_secret_directory: "{{ grav_base_directory }}/secrets"
grav_secrets: []

# GID interne de www-data dans grav-runtime (image basée sur php:*-fpm-alpine,
# voir Dockerfile/entrypoint.sh du runtime : uid/gid 82). Les fichiers
# secrets sont la seule donnée que le rôle dépose sur l'hôte sans jamais
# passer par le mécanisme de permissions du runtime (montage RO, jamais
# chowné par le conteneur) : le rôle doit donc leur donner directement le
# bon gid numérique pour que PHP-FPM (www-data, gid 82 dans le conteneur)
# puisse les lire, sans recourir à un bit "other".
grav_container_gid: 82

# Bootstrap administrateur — transmis tel quel au runtime. Politique du
# runtime : les 3 premières variables doivent être toutes définies ou
# toutes absentes (voir tasks/assert.yml).
grav_admin_user: ""
grav_admin_password: ""
grav_admin_email: ""
grav_admin_fullname: ""
grav_admin_title: ""
grav_admin_language: ""

# Type de permissions du compte bootstrapé, transmis tel quel au runtime
# (voir grav-runtime docker/bootstrap-admin.sh). "" laisse le runtime
# décider (son propre défaut : "both"). Additif (v2.0.0) — voir README.md
# "Contrat avec grav-runtime".
grav_admin_type: ""

grav_timezone: ""

# Échappatoire générique : variables d'environnement additionnelles
# acceptées par une future version de grav-runtime, sans avoir à modifier ce
# rôle pour chaque nouvelle variable.
grav_extra_environment: {}

# Healthcheck Docker déclaré dans docker-compose.yml — mêmes valeurs que le
# HEALTHCHECK déjà défini dans l'image (Dockerfile de grav-runtime), reprises
# ici pour rester explicites dans le compose généré et ajustables sans
# reconstruire l'image.
grav_healthcheck_interval: "30s"
grav_healthcheck_timeout: "3s"
grav_healthcheck_start_period: "10s"
grav_healthcheck_retries: 3

# Attente côté Ansible d'un VERDICT de santé Docker définitif ("healthy" ou
# "unhealthy") avant de conclure — voir tasks/healthcheck.yml. La fenêtre
# (retries × delay = 60 × 5 = 300 s) doit dépasser la durée au terme de
# laquelle Docker cesse de répondre "starting" : pire cas avec le
# healthcheck par défaut = start_period (10s) + interval (30s) × retries
# (3) ≈ 100 s. tasks/assert.yml impose un plancher explicite de 120 s
# (plutôt qu'un parsing fragile de "30s"/"1m…"). Marge restante = temps de
# démarrage applicatif de Grav.
grav_deploy_wait_retries: 60
grav_deploy_wait_delay: 5

# /healthz (ci-dessus) est un endpoint technique qui ne passe jamais par
# Grav lui-même. Le rôle vérifie donc, en plus, qu'une page réelle du site
# répond correctement.
#
# grav_site_check_host : vide par défaut => l'adresse du contrôle HTTP est
# DÉRIVÉE de grav_bind_address (voir vars/main.yml _grav_site_check_host) :
# adresse d'écoute précise -> même adresse ; "0.0.0.0" -> "127.0.0.1"
# (une adresse d'écoute n'est pas une destination joignable). Renseigner
# cette variable force une adresse explicite (échappatoire) ; elle ne doit
# alors pas contenir ":" (ni IPv6, ni port — le port vient de
# grav_http_port). Le contrôle s'exécute sur l'hôte cible lui-même.
grav_site_check_host: ""
grav_site_check_path: "/"
grav_site_check_status: 200
grav_site_check_retries: 10
grav_site_check_delay: 5
grav_site_check_timeout: 5

# Installation de Docker / Docker Compose. À désactiver si l'hôte est déjà
# préparé par ailleurs.
grav_manage_docker: true

# started: (re)crée/démarre le service avec l'image et la config courantes.
# stopped: arrête le service sans supprimer les volumes persistants.
# restarted: force un redémarrage du conteneur.
grav_state: "started"

# Politique de récupération d'image (contrat v1.0.1 §5.6). Par défaut le
# rôle utilise "missing" : l'image n'est tirée que si elle est absente
# localement — un redémarrage ne dépend donc pas de la disponibilité du
# registre. Mettre à true pour forcer un "pull always" explicite (récupérer
# une éventuelle nouvelle image derrière un tag mobile).
grav_force_pull: false
