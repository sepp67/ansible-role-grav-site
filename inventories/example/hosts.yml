---
# Inventaire d'EXEMPLE — valeurs volontairement fictives et non routables.
# Ce dépôt ne cible aucune VM réelle.
#
# Pour un déploiement réel : copiez ce dossier
#   cp -r inventories/example inventories/mon-site
# puis éditez inventories/mon-site/ (hôte, group_vars, vault.yml).
# Voir README.md, « Utilisation autonome du dépôt ».
all:
  children:
    grav_servers:
      hosts:
        grav-vm.example.test:
          # RFC 5737 (TEST-NET-3), non routable — remplacez par l'IP LAN de votre VM.
          ansible_host: 203.0.113.10
          # ansible_user: deploy   # si différent de l'utilisateur SSH par défaut
          # ansible_port: 22
