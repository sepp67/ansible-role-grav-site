---
# Inventaire de production — modèle à adapter dans le dépôt canonique, puis
# inventaire OPÉRATIONNEL une fois édité dans le clone d'un opérateur (voir
# README.md "inventories/production/ : modèle ou inventaire opérationnel ?").
#
# Remplacez CHANGE_ME.example.org et l'adresse ansible_host par la VM cible
# réelle, PUIS commitez ce fichier dans votre propre clone/fork — jamais
# vers le dépôt canonique en amont, qui doit rester un modèle générique
# pour d'autres opérateurs. Aucun secret n'y transite (voir vault.yml).
#
# Un seul hôte suffit pour déployer une instance ; pour déployer plusieurs
# instances (autre application, autre environnement), dupliquez ce dossier
# (inventories/<autre-nom>/) plutôt que d'ajouter des hôtes hétérogènes
# dans le même groupe group_vars.
all:
  children:
    grav_servers:
      hosts:
        CHANGE_ME.example.org:
          ansible_host: 203.0.113.10   # exemple RFC 5737 — à remplacer
          # ansible_user: deploy        # décommenter si différent de l'utilisateur SSH par défaut
          # ansible_port: 22
