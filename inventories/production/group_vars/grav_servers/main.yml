---
# Profil de déploiement : projet-gites — variables NON sensibles
# uniquement (voir vault.yml.example pour les secrets, jamais mélangés ici).
#
# grav_image / grav_version sont les deux seules variables qui identifient
# l'application déployée (voir README.md du rôle, "Variables") — le rôle
# lui-même reste générique et n'en impose aucune valeur par défaut.
#
# Modèle dans le dépôt canonique, inventaire OPÉRATIONNEL une fois édité —
# voir README.md "inventories/production/ : modèle ou inventaire
# opérationnel ?". Après avoir remplacé grav_version ci-dessous, commitez
# ce fichier dans votre propre clone/fork (jamais vers le dépôt canonique).
# Chaque changement de grav_version devient ainsi un commit auditable,
# cohérent avec deployed_versions.log tenu côté hôte cible.

grav_image: "ghcr.io/sepp67/projet-gites"
grav_version: "<VERSION_EXPLICITE>"   # À REMPLACER par un tag réellement publié (ex. "1.0.0") — jamais "latest"

grav_container_name: "projet-gites"
grav_base_directory: "/opt/projet-gites"

grav_bind_address: "127.0.0.1"
grav_http_port: 8080

# Bootstrap administrateur : jamais de valeur en clair ici. Indirection
# explicite vers le Vault (voir vault.yml.example et README.md "Stratégie
# des secrets") — group_vars/main.yml ne contient donc lui-même aucun
# secret, chiffré ou non.
grav_admin_user: "{{ vault_grav_admin_user }}"
grav_admin_password: "{{ vault_grav_admin_password }}"
grav_admin_email: "{{ vault_grav_admin_email }}"
grav_admin_fullname: "{{ vault_grav_admin_fullname }}"
grav_admin_title: "{{ vault_grav_admin_title }}"
grav_admin_language: "{{ vault_grav_admin_language }}"

# Secret applicatif optionnel attendu par certaines images dérivées de
# grav-runtime (ex. email-private.php pour projet-gites) — décommenter si
# nécessaire, contenu vaultisé dans vault.yml (voir vault.yml.example) :
# grav_secrets:
#   - name: email-private.php
#     content: "{{ vault_grav_email_private_php }}"
