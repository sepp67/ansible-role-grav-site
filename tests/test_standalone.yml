---
# Test fonctionnel de la couche d'exploitation autonome (playbooks/,
# ansible.cfg) : prouve que playbooks/deploy.yml, check.yml, restart.yml et
# stop.yml fonctionnent réellement depuis la racine de CE dépôt, sans
# Control Repository ni aucun autre dépôt Ansible — et que la résolution du
# rôle par chemin relatif fonctionne en pratique, pas seulement en théorie
# (voir README.md "Résolution du rôle").
#
# Exécute les vrais fichiers playbooks/*.yml en sous-processus (pas une
# copie, pas un include) : un `ansible-playbook playbooks/deploy.yml`
# lancé par un opérateur depuis la racine du dépôt est exactement ce qui
# est exercé ici.
#
# N'utilise que des images publiques réelles de grav-runtime (aucun contenu
# métier), sur localhost, avec nettoyage complet en fin d'exécution —
# CE N'EST PAS un déploiement de production (grav_manage_docker=false,
# aucun hôte distant, aucune donnée réelle).
#
# become: true requis depuis tasks/privilege_guard.yml (contrat v2.0.1,
# audit privilèges 2026-09) : grav_base_directory et grav.env ont
# désormais un propriétaire root explicite, même sous /tmp. L'ancienne
# option `-e ansible_become=false` (qui reposait sur le fait qu'aucune
# tâche de CE test n'imposait alors de propriétaire) a été retirée — elle
# masquerait précisément la régression que ce test doit prévenir. La
# machine qui exécute ce test doit désormais disposer d'un sudo non
# interactif (comme le runner CI) — voir README.md "Prérequis".
#
# Usage (depuis la racine du dépôt) :
#   cd tests && ansible-playbook -i inventory test_standalone.yml

- name: "Test fonctionnel de la couche autonome (playbooks/)"
  hosts: localhost
  connection: local

  vars:
    grav_standalone_base_directory: "/tmp/grav-site-standalone-test"
    grav_standalone_container_name: "grav-site-standalone-test"
    grav_standalone_http_port: 18090
    grav_standalone_image: "ghcr.io/sepp67/grav-runtime"
    grav_standalone_version: "1.0.4"
    # Identifiants fictifs : requis par la garde administrateur
    # (tasks/admin_guard.yml) tant que le volume "accounts" est vide. Le mot
    # de passe satisfait la politique Grav (>= 8, majuscule, minuscule,
    # chiffre) — sinon "bin/plugin login new-user" boucle et le conteneur
    # ne devient jamais healthy. "not-a-real-secret" garde la valeur
    # transparente pour l'audit de non-fuite.
    grav_standalone_extra_args: >-
      -e grav_manage_docker=false
      -e grav_image={{ grav_standalone_image }}
      -e grav_version={{ grav_standalone_version }}
      -e grav_container_name={{ grav_standalone_container_name }}
      -e grav_base_directory={{ grav_standalone_base_directory }}
      -e grav_bind_address=127.0.0.1
      -e grav_http_port={{ grav_standalone_http_port }}
      -e grav_admin_user=standaloneadmin
      -e grav_admin_password=Standalone1-not-a-real-secret
      -e grav_admin_email=standaloneadmin@example.test
      -e grav_site_check_path=/admin
      -e grav_healthcheck_start_period={{ grav_standalone_start_period | default('10s') }}
      -e grav_deploy_wait_retries={{ grav_standalone_wait_retries | default(60) }}
      -e grav_deploy_wait_delay={{ grav_standalone_wait_delay | default(5) }}

  tasks:
    - name: "Nettoyer un éventuel reliquat d'une exécution précédente"
      block:
        - name: "Supprimer un éventuel conteneur/volumes précédents"
          community.docker.docker_compose_v2:
            project_src: "{{ grav_standalone_base_directory }}"
            state: absent
          when: (grav_standalone_base_directory ~ '/docker-compose.yml') is file

        - name: "Supprimer un éventuel répertoire précédent (via un conteneur root)"
          ansible.builtin.command:
            cmd: >-
              docker run --rm -v {{ grav_standalone_base_directory | dirname }}:/cleanup
              alpine rm -rf /cleanup/{{ grav_standalone_base_directory | basename }}
          when: (grav_standalone_base_directory) is directory
          changed_when: true
      rescue:
        - name: "Ignorer les erreurs de nettoyage (rien à nettoyer)"
          ansible.builtin.debug:
            msg: "Rien à nettoyer."

    - name: "Vérifier la syntaxe des playbooks autonomes"
      ansible.builtin.command:
        cmd: >-
          ansible-playbook --syntax-check
          -i {{ playbook_dir }}/inventory_grav_servers
          {{ playbook_dir }}/../playbooks/{{ item }}
      loop:
        - deploy.yml
        - check.yml
        - restart.yml
        - stop.yml
      changed_when: false

    - name: "Exécuter playbooks/deploy.yml (résolution du rôle depuis la racine du dépôt, sans Control Repository)"
      ansible.builtin.command:
        cmd: >-
          ansible-playbook
          -i {{ playbook_dir }}/inventory_grav_servers
          {{ playbook_dir }}/../playbooks/deploy.yml
          {{ grav_standalone_extra_args }}
      changed_when: true

    - name: "Vérifier l'image réellement en exécution après playbooks/deploy.yml"
      ansible.builtin.command:
        cmd: "docker inspect --format='{{ '{{' }}.Config.Image{{ '}}' }}' {{ grav_standalone_container_name }}"
      register: grav_standalone_running_image
      changed_when: false

    - name: "Confirmer que l'image en exécution correspond à la version déployée"
      ansible.builtin.assert:
        that:
          - grav_standalone_running_image.stdout | trim == (grav_standalone_image ~ ':' ~ grav_standalone_version)
        fail_msg: >-
          Image en exécution ({{ grav_standalone_running_image.stdout | trim }}) différente de
          la version demandée à playbooks/deploy.yml ({{ grav_standalone_image }}:{{ grav_standalone_version }}).
        quiet: true

    - name: "Exécuter playbooks/check.yml (vérification, aucun changement d'état attendu)"
      ansible.builtin.command:
        cmd: >-
          ansible-playbook
          -i {{ playbook_dir }}/inventory_grav_servers
          {{ playbook_dir }}/../playbooks/check.yml
          {{ grav_standalone_extra_args }}
      register: grav_standalone_check_result
      changed_when: false
      failed_when: grav_standalone_check_result.rc != 0

    - name: "Exécuter playbooks/restart.yml"
      ansible.builtin.command:
        cmd: >-
          ansible-playbook
          -i {{ playbook_dir }}/inventory_grav_servers
          {{ playbook_dir }}/../playbooks/restart.yml
          {{ grav_standalone_extra_args }}
      changed_when: true

    - name: "Confirmer que le conteneur tourne toujours après playbooks/restart.yml"
      ansible.builtin.command:
        cmd: "docker inspect --format='{{ '{{' }}.State.Status{{ '}}' }}' {{ grav_standalone_container_name }}"
      register: grav_standalone_status_after_restart
      changed_when: false
      failed_when: grav_standalone_status_after_restart.stdout | trim != 'running'

    - name: "Exécuter playbooks/stop.yml"
      ansible.builtin.command:
        cmd: >-
          ansible-playbook
          -i {{ playbook_dir }}/inventory_grav_servers
          {{ playbook_dir }}/../playbooks/stop.yml
          {{ grav_standalone_extra_args }}
      changed_when: true

    - name: "Confirmer que le conteneur est arrêté après playbooks/stop.yml (données conservées)"
      ansible.builtin.command:
        cmd: "docker inspect --format='{{ '{{' }}.State.Status{{ '}}' }}' {{ grav_standalone_container_name }}"
      register: grav_standalone_status_after_stop
      changed_when: false
      failed_when: grav_standalone_status_after_stop.stdout | trim != 'exited'

    - name: "Confirmer que le répertoire persistant existe toujours après l'arrêt"
      ansible.builtin.stat:
        path: "{{ grav_standalone_base_directory }}/data/pages"
      register: grav_standalone_pages_dir
      failed_when: not grav_standalone_pages_dir.stat.exists

    - name: "Nettoyer l'environnement de test"
      block:
        - name: "Arrêter et supprimer le conteneur de test"
          community.docker.docker_compose_v2:
            project_src: "{{ grav_standalone_base_directory }}"
            state: absent

        - name: "Supprimer le répertoire de test (via un conteneur root)"
          ansible.builtin.command:
            cmd: >-
              docker run --rm -v {{ grav_standalone_base_directory | dirname }}:/cleanup
              alpine rm -rf /cleanup/{{ grav_standalone_base_directory | basename }}
          changed_when: true
