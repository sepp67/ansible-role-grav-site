---
# Test fonctionnel du rôle T04-T08 : distingue explicitement 4 cas avec deux
# versions publiques réelles et distinctes de grav-runtime (aucun contenu
# métier), en vérifiant à chaque étape l'image RÉELLEMENT en exécution
# (docker inspect), la persistance des données et l'idempotence de
# deployed_versions.log :
#
#   1. (T04) Déploiement initial de la version A : compte créé, 4 volumes
#      initialisés, marqueur distinct déposé dans chacun des 4 volumes.
#   2. (T05) Redéploiement de la MÊME version A (idempotence attendue : le
#      journal des versions ne doit PAS grandir ; aucun marqueur modifié ;
#      compte inchangé).
#   3. (T06) Mise à jour réelle A -> B (le journal DOIT grandir de 1 ligne ;
#      conteneur sur B ; 4 marqueurs conservés ; compte conservé).
#   4. (T07) Rollback réel B -> A (le journal DOIT grandir de 1 ligne ;
#      conteneur sur A ; 4 marqueurs conservés ; compte conservé).
#
# (T08) Dans les 4 phases : les marqueurs des 4 volumes persistants
# (pages, accounts, data, images) survivent, le nombre de fichiers de comptes
# et le checksum de <grav_admin_user>.yaml restent stables — le seed de
# l'image B n'écrase aucune donnée persistante.
#
# Prérequis : Docker et le plugin Docker Compose déjà installés sur l'hôte
# de test (grav_manage_docker: false ici, pour ne pas modifier la machine
# qui exécute les tests — l'installation de Docker est testée séparément,
# voir README.md "Tests").
#
# Usage (depuis la racine du dépôt) :
#   cd tests && ansible-playbook -i inventory test.yml
#
# Le rôle est référencé par chemin relatif à ce fichier
# ("{{ playbook_dir }}/.."), jamais par son nom : la résolution ne dépend
# donc jamais du nom du dossier sous lequel ce dépôt a été cloné (vérifié
# empiriquement — voir README.md "Résolution du rôle").

- name: "Test fonctionnel du rôle grav-site : redéploiement / mise à jour / rollback"
  hosts: localhost
  connection: local

  vars:
    grav_manage_docker: false
    grav_image: "ghcr.io/sepp67/grav-runtime"
    grav_version_a: "1.0.3"   # référence initiale + cible du rollback (T04, T07)
    grav_version_b: "1.0.4"   # cible de la mise à jour réelle (T06)
    # Marqueur T08 déposé dans chacun des 4 volumes. Ne se termine JAMAIS par
    # .yaml / .yml : il ne doit pas pouvoir être compté comme un fichier de
    # compte (ni par la garde admin_guard, ni par les vérifications T08).
    grav_t08_marker_name: ".persistence-test-marker"
    grav_container_name: "grav-site-test"
    grav_base_directory: "/tmp/grav-site-test"
    grav_bind_address: "127.0.0.1"
    grav_http_port: 18080
    # Identifiants fictifs — nécessaires depuis la garde administrateur
    # (tasks/admin_guard.yml) : le volume "accounts" est vide au 1er
    # déploiement, les trois variables deviennent obligatoires ; le runtime
    # bootstrape alors le compte et la vérification post-démarrage passe.
    grav_admin_user: "testadmin"
    # Doit satisfaire la politique de mot de passe de Grav (>= 8, une
    # majuscule, une minuscule, un chiffre) : sinon "bin/plugin login
    # new-user" boucle sur "Password does not pass the minimum requirements"
    # et le conteneur ne devient jamais healthy. La sous-chaîne
    # "not-a-real-secret" garde la valeur transparente pour l'audit de
    # non-fuite (tests/test_no_secret_leak.yml).
    grav_admin_password: "Test1-not-a-real-secret"
    grav_admin_email: "testadmin@example.test"
    # grav-runtime nu + compte admin bootstrapé : "/" répond 404 (pas de
    # redirection vers /admin dès qu'un compte existe), "/admin" répond 200.
    grav_site_check_path: "/admin"

  tasks:
    # ------------------------------------------------------------------
    # Pré-vol : le marqueur T08 est inoffensif, et les deux images de
    # T04-T08 honorent le contrat grav-runtime (login plugin + bin/plugin +
    # bootstrap-admin.sh). Si une image ne le respecte pas, NE PAS
    # contourner la garde administrateur : choisir une paire compatible ou
    # arrêter la préparation (BLOCKED — GRAV-RUNTIME CONTRACT).
    # ------------------------------------------------------------------
    - name: "Pré-vol : le nom du marqueur T08 ne se termine pas par .yaml / .yml"
      ansible.builtin.assert:
        that:
          - not (grav_t08_marker_name is search('\\.ya?ml$'))
        quiet: true

    - name: "Pré-vol : les images A et B honorent le contrat grav-runtime"
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --entrypoint
          - sh
          - "{{ grav_image }}:{{ item }}"
          - -c
          - >-
            test -d /var/www/html/user/plugins/login
            && test -f /var/www/html/bin/plugin
            && test -f /bootstrap-admin.sh
      changed_when: false
      loop:
        - "{{ grav_version_a }}"
        - "{{ grav_version_b }}"
      register: _t08_contract
      failed_when: _t08_contract.rc != 0

    - name: "Nettoyer un éventuel reliquat d'une exécution précédente"
      block:
        - name: "Supprimer un éventuel conteneur/volumes précédents"
          community.docker.docker_compose_v2:
            project_src: "{{ grav_base_directory }}"
            state: absent
          when: (grav_base_directory ~ '/docker-compose.yml') is file

        # Une fois initialisés par grav-runtime, certains sous-répertoires
        # appartiennent à www-data (uid/gid 82) à l'intérieur du conteneur :
        # l'utilisateur Ansible ne peut plus y accéder pour les supprimer
        # lui-même. Un conteneur jetable exécuté en root le peut (root
        # ignore les vérifications de permissions Unix classiques).
        - name: "Supprimer un éventuel répertoire précédent (via un conteneur root)"
          ansible.builtin.command:
            cmd: >-
              docker run --rm -v {{ grav_base_directory | dirname }}:/cleanup
              alpine rm -rf /cleanup/{{ grav_base_directory | basename }}
          when: (grav_base_directory) is directory
          changed_when: true
      rescue:
        - name: "Ignorer les erreurs de nettoyage (rien à nettoyer)"
          ansible.builtin.debug:
            msg: "Rien à nettoyer."

    # ------------------------------------------------------------------
    # Phase 1 : déploiement initial de la version A
    # ------------------------------------------------------------------
    - name: "Phase 1 : déployer la version A"  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/.."
        public: true
      vars:
        grav_version: "{{ grav_version_a }}"

    - name: "Phase 1 (T04) : déposer un marqueur distinct dans chacun des 4 volumes"
      ansible.builtin.command:
        cmd: >-
          docker exec {{ grav_container_name }} sh -c
          "printf '%s' '{{ item }}' > /var/www/html/user/{{ item }}/{{ grav_t08_marker_name }}"
      loop: [pages, accounts, data, images]
      changed_when: true

    - name: "Phase 1 (T04/T08) : figer la référence du volume accounts (comptes + checksum)"
      block:
        - name: "Compter les fichiers de comptes initiaux"
          ansible.builtin.command:
            cmd: >-
              docker exec {{ grav_container_name }} sh -c
              "ls -1 /var/www/html/user/accounts/*.yaml /var/www/html/user/accounts/*.yml 2>/dev/null | wc -l"
          register: _t08_accounts_baseline
          changed_when: false

        - name: "Checksum initial de <grav_admin_user>.yaml"
          ansible.builtin.command:
            cmd: >-
              docker exec {{ grav_container_name }}
              sha256sum /var/www/html/user/accounts/{{ grav_admin_user }}.yaml
          register: _t08_testadmin_baseline
          changed_when: false

        - name: "Figer les valeurs de référence T08"
          ansible.builtin.set_fact:
            grav_t08_accounts_count: "{{ _t08_accounts_baseline.stdout | trim | int }}"
            grav_t08_testadmin_sha: "{{ _t08_testadmin_baseline.stdout | trim | split(' ') | first }}"

    - name: "Phase 1 (T04) : le compte administrateur a bien été créé"
      ansible.builtin.assert:
        that:
          - grav_t08_accounts_count | int == 1
          - grav_t08_testadmin_sha | length == 64
        fail_msg: "T04 : aucun fichier de compte administrateur après le premier déploiement."
        quiet: true

    - name: "Phase 1 : vérifications"
      ansible.builtin.include_tasks: _verify_phase.yml
      vars:
        grav_phase_label: "Phase 1 (T04) — déploiement initial A"
        grav_expected_version: "{{ grav_version_a }}"
        grav_expected_log_count: 1

    # ------------------------------------------------------------------
    # Phase 2 (T05) : redéploiement de la MÊME version A (idempotence)
    # ------------------------------------------------------------------
    - name: "Phase 2 (T05) : redéployer la même version A"  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/.."
        public: true
      vars:
        grav_version: "{{ grav_version_a }}"

    - name: "Phase 2 : vérifications"
      ansible.builtin.include_tasks: _verify_phase.yml
      vars:
        grav_phase_label: "Phase 2 (T05) — redéploiement identique A (idempotence)"
        grav_expected_version: "{{ grav_version_a }}"
        grav_expected_log_count: 1

    # ------------------------------------------------------------------
    # Phase 3 (T06) : mise à jour réelle A -> B
    # ------------------------------------------------------------------
    - name: "Phase 3 (T06) : mettre à jour vers la version B"  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/.."
        public: true
      vars:
        grav_version: "{{ grav_version_b }}"

    - name: "Phase 3 : vérifications"
      ansible.builtin.include_tasks: _verify_phase.yml
      vars:
        grav_phase_label: "Phase 3 (T06) — mise à jour réelle A -> B"
        grav_expected_version: "{{ grav_version_b }}"
        grav_expected_log_count: 2

    # ------------------------------------------------------------------
    # Phase 4 (T07) : rollback réel B -> A
    # ------------------------------------------------------------------
    - name: "Phase 4 (T07) : revenir (rollback) à la version A"  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/.."
        public: true
      vars:
        grav_version: "{{ grav_version_a }}"

    - name: "Phase 4 : vérifications"
      ansible.builtin.include_tasks: _verify_phase.yml
      vars:
        grav_phase_label: "Phase 4 (T07) — rollback réel B -> A"
        grav_expected_version: "{{ grav_version_a }}"
        grav_expected_log_count: 3

    - name: "Nettoyer l'environnement de test"
      block:
        - name: "Arrêter et supprimer le conteneur de test"
          community.docker.docker_compose_v2:
            project_src: "{{ grav_base_directory }}"
            state: absent

        - name: "Supprimer le répertoire de test (via un conteneur root)"
          ansible.builtin.command:
            cmd: >-
              docker run --rm -v {{ grav_base_directory | dirname }}:/cleanup
              alpine rm -rf /cleanup/{{ grav_base_directory | basename }}
          changed_when: true
