---
# Audit de non-fuite des secrets (contrat v1.0.1 §9.4 / contrainte Lot 8 §9).
#
# Statique, aucun Docker. Rend en mémoire les templates qui pourraient
# contenir un mot de passe et vérifie que le marqueur n'apparaît QUE dans
# grav.env — jamais dans le compose, jamais dans l'état structuré, jamais
# dans aucun fichier suivi par Git.
#
# Le contrat autorise le mot de passe dans grav.env uniquement si le fichier
# est root:root, 0600 et jamais affiché : c'est vérifié ici sur la
# définition de la tâche (tasks/deploy.yml).
#
# Usage : cd tests && ansible-playbook -i inventory test_no_secret_leak.yml

- name: "Audit non-fuite des secrets (aucun Docker)"
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    _leak_marker: "PW-LEAK-MARKER-Zx9qW"
    _role_root: "{{ playbook_dir }}/.."
    # Contexte minimal pour rendre les templates.
    grav_image: "ghcr.io/example/site"
    grav_version: "1.0.0"
    grav_digest: "sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    grav_container_name: "grav-site"
    grav_base_directory: "/opt/grav-site/grav-site"
    grav_bind_address: "127.0.0.1"
    grav_http_port: 8080
    grav_restart_policy: "unless-stopped"
    grav_pages_directory: "/opt/grav-site/grav-site/data/pages"
    grav_accounts_directory: "/opt/grav-site/grav-site/data/accounts"
    grav_data_directory: "/opt/grav-site/grav-site/data/data"
    grav_images_directory: "/opt/grav-site/grav-site/data/images"
    grav_secret_directory: "/opt/grav-site/grav-site/secrets"
    grav_secrets: []
    grav_admin_user: "admin"
    grav_admin_password: "{{ _leak_marker }}"
    grav_admin_email: "admin@example.test"
    grav_admin_fullname: ""
    grav_admin_title: ""
    grav_admin_language: ""
    grav_admin_type: ""
    grav_timezone: ""
    grav_extra_environment: {}
    grav_healthcheck_interval: "30s"
    grav_healthcheck_timeout: "3s"
    grav_healthcheck_start_period: "10s"
    grav_healthcheck_retries: 3
    _grav_effective_reference: "{{ grav_image }}@{{ grav_digest }}"
    _grav_deployed_at: "2026-09-03T12:00:00Z"

  tasks:
    - name: "Rendre grav.env.j2 (DOIT contenir le marqueur)"
      ansible.builtin.set_fact:
        _render_env: "{{ lookup('ansible.builtin.template', _role_root ~ '/templates/grav.env.j2') }}"
      no_log: true

    - name: "Rendre docker-compose.yml.j2 (NE DOIT PAS contenir le marqueur)"
      ansible.builtin.set_fact:
        _render_compose: "{{ lookup('ansible.builtin.template', _role_root ~ '/templates/docker-compose.yml.j2') }}"

    - name: "Rendre deployed_state.yml.j2 (NE DOIT PAS contenir le marqueur)"
      ansible.builtin.set_fact:
        _render_state: "{{ lookup('ansible.builtin.template', _role_root ~ '/templates/deployed_state.yml.j2') }}"

    - name: "Rendre grav_versions log line (version.yml) — reconstruction"
      ansible.builtin.set_fact:
        _render_logline: "{{ _grav_deployed_at }} {{ grav_version }} {{ _grav_effective_reference }}"

    - name: "Assertions : le marqueur n'est QUE dans grav.env"
      ansible.builtin.assert:
        that:
          - _leak_marker in _render_env
          - _leak_marker not in _render_compose
          - _leak_marker not in _render_state
          - _leak_marker not in _render_logline
        fail_msg: "Le mot de passe fuit hors de grav.env (compose / état structuré / journal)."
        success_msg: >-
          OK — le mot de passe n'apparaît que dans grav.env ; absent du compose,
          de .deployed_state.yml et de la ligne de journal.
        quiet: true
      no_log: true

    - name: "Vérifier que tasks/deploy.yml rend grav.env en 0600 + no_log"
      ansible.builtin.slurp:
        src: "{{ _role_root }}/tasks/deploy.yml"
      register: _deploy_src

    - name: "Assertion : grav.env 0600 + no_log dans deploy.yml"
      vars:
        _d: "{{ _deploy_src.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'grav.env' in _d"
          - "'mode: \"0600\"' in _d"
          - "'no_log: true' in _d"
        fail_msg: "tasks/deploy.yml : grav.env n'est plus rendu en 0600 sous no_log."
        quiet: true

    # Les mots de passe des scénarios Molecule sont générés à l'exécution
    # (molpw-<20 aléatoires>, molt16-<22 aléatoires>) ; l'audit utilise
    # PW-LEAK-MARKER. Une valeur GÉNÉRÉE (>= 18 caractères alphanumériques
    # après le préfixe) ou le marqueur ne doit jamais être suivi par Git —
    # cela signalerait un fichier de run committé par erreur. Les lignes
    # « molpw-a-{{ lookup(...) }} » (préfixe + template) ne matchent pas.
    - name: "Aucun mot de passe généré / marqueur d'audit suivi par Git"  # noqa: command-instead-of-module
      ansible.builtin.command:
        # Exclut CE fichier (qui définit et grep le marqueur, forcément présent).
        cmd: >-
          git -C {{ _role_root }} grep -nE
          'molpw-[A-Za-z0-9]{18,}|molt16-[A-Za-z0-9]{18,}|PW-LEAK-MARKER-Zx9qW'
          -- . ':!tests/test_no_secret_leak.yml'
      register: _git_grep
      changed_when: false
      failed_when: _git_grep.rc == 0

    # Les mots de passe des scénarios de déploiement (test.yml, test_standalone,
    # T22) sont des valeurs littérales transparentes (« …not-a-real-secret »)
    # ou générées à l'exécution ; test_env_encoding utilise volontairement une
    # valeur à caractères spéciaux pour vérifier l'encodage de grav.env. Aucune
    # n'est un identifiant réel. On vérifie qu'aucun littéral de tests/ ne
    # ressemble à un secret réel (>= 16 caractères, majuscule + minuscule +
    # chiffre, hors valeurs marquées).
    - name: "Extraire les valeurs grav_admin_password littérales de tests/"  # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: >-
          git -C {{ _role_root }} grep -hoE 'grav_admin_password[=:] *"[^"{}]{1,}"' -- tests/
      register: _pw_literals
      changed_when: false
      failed_when: false

    - name: "Assertion : aucun littéral ne ressemble à un identifiant réel"
      ansible.builtin.assert:
        that:
          - >-
            _pw_literals.stdout_lines
            | map('regex_replace', '^.*"([^"]*)"$', '\1')
            | select('search', '^(?=.{16,})(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9]).*$')
            | reject('search', 'not-a-real-secret')
            | list | length == 0
        fail_msg: "Un mot de passe littéral de tests/ ressemble à un identifiant réel : {{ _pw_literals.stdout }}"
        success_msg: "OK — aucun littéral de tests/ ne ressemble à un identifiant réel."
        quiet: true

    - name: "Bilan"
      ansible.builtin.debug:
        msg: >-
          Audit OK — le mot de passe ne sort pas de grav.env (0600, no_log) ;
          aucun mot de passe généré / marqueur d'audit n'est suivi par Git ;
          aucun littéral de test ne ressemble à un identifiant réel.
