---
# Fichiers secrets (security-private.php, email-private.php, ...), montés
# individuellement en lecture seule sous user/config/ (voir
# templates/docker-compose.yml.j2). Jamais générés par le rôle : leur
# contenu vient exclusivement de grav_secrets (src ou content, à vaultiser).

- name: "Valider la définition de chaque secret"
  ansible.builtin.assert:
    that:
      - item.name is defined
      - (item.src is defined) != (item.content is defined)
    fail_msg: >-
      Chaque entrée de grav_secrets doit fournir 'name' et exactement l'un
      de 'src' (chemin local) ou 'content' (contenu inline) — entrée
      invalide : {{ item }}
    quiet: true
  loop: "{{ grav_secrets }}"
  loop_control:
    label: "{{ item.name | default('(sans nom)') }}"

# Le nom sert à construire un chemin de fichier (grav_secret_directory/name)
# et un point de montage Docker (voir templates/docker-compose.yml.j2) : ni
# séparateur de chemin, ni ".." (traversée de répertoire), ni ":" (casserait
# la syntaxe "host:conteneur:ro" du bind mount).
- name: "Valider le nom de chaque secret"
  ansible.builtin.assert:
    that:
      - item.name is regex('^[A-Za-z0-9][A-Za-z0-9._-]*$')
      - "'..' not in item.name"
      - "'/' not in item.name"
      - "':' not in item.name"
    fail_msg: >-
      Nom de secret invalide : "{{ item.name }}". Doit commencer par un
      caractère alphanumérique et ne contenir que des lettres, chiffres,
      ".", "_" ou "-" — jamais "..", "/" ni ":".
    quiet: true
  loop: "{{ grav_secrets }}"
  loop_control:
    label: "{{ item.name | default('(sans nom)') }}"

- name: "Créer le répertoire des secrets"
  ansible.builtin.file:
    path: "{{ grav_secret_directory }}"
    state: directory
    owner: root
    group: "{{ grav_container_gid }}"
    mode: "0750"
  when: grav_secrets | length > 0

- name: "Déposer les secrets fournis par fichier source"
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ grav_secret_directory }}/{{ item.name }}"
    owner: root
    group: "{{ grav_container_gid }}"
    mode: "0640"
  loop: "{{ grav_secrets }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.src is defined
  no_log: true

- name: "Déposer les secrets fournis en contenu inline"
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "{{ grav_secret_directory }}/{{ item.name }}"
    owner: root
    group: "{{ grav_container_gid }}"
    mode: "0640"
  loop: "{{ grav_secrets }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.content is defined
  no_log: true
