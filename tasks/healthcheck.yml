---
# Le HEALTHCHECK Docker natif de l'image (GET /healthz, technique, ne passe
# jamais par Grav) prouve que Nginx et PHP-FPM sont vivants et reliés.
#
# Sémantique de l'attente :
#   - "starting"  -> le rôle CONTINUE d'attendre (dans la fenêtre bornée) ;
#   - "healthy"   -> succès, on passe au contrôle HTTP applicatif ;
#   - "unhealthy" -> ÉCHEC IMMÉDIAT (rescue), aucune nouvelle tentative.
# La fenêtre retries × delay (>= 120 s, validée dans tasks/assert.yml ;
# 300 s par défaut) borne UNIQUEMENT la phase "starting" — ce n'est pas une
# période de récupération après "unhealthy".
#
# Voir grav-runtime README.md "Healthcheck" : la limite assumée du
# HEALTHCHECK natif est documentée là, le contrôle HTTP ci-dessous est ce
# que le runtime attend du rôle de déploiement.

- name: "Attendre le verdict de santé Docker puis vérifier que le site répond"
  block:
    - name: "Attendre que Docker rende un verdict de santé (ni 'starting')"
      ansible.builtin.command:
        cmd: "docker inspect --format='{{ '{{' }}.State.Health.Status{{ '}}' }}' {{ grav_container_name }}"
      register: _grav_health_status
      changed_when: false
      # Sortie de boucle sur un verdict définitif. "starting" ne satisfait
      # pas la condition -> on retente (pas de faux négatif pendant le
      # start_period). "unhealthy" la satisfait -> on sort, et l'assert
      # suivant échoue immédiatement (pas d'attente supplémentaire).
      until: _grav_health_status.stdout | trim in ['healthy', 'unhealthy']
      retries: "{{ grav_deploy_wait_retries }}"
      delay: "{{ grav_deploy_wait_delay }}"

    - name: "Exiger que le verdict de santé soit 'healthy'"
      ansible.builtin.assert:
        that:
          - _grav_health_status.stdout | trim == 'healthy'
        fail_msg: >-
          Le conteneur {{ grav_container_name }} a été déclaré
          "{{ _grav_health_status.stdout | trim }}" par Docker (le
          healthcheck natif /healthz ne passe pas).
        quiet: true

    - name: "Vérifier qu'une page réelle du site répond"
      ansible.builtin.uri:
        url: "http://{{ _grav_site_check_host }}:{{ grav_http_port }}{{ grav_site_check_path }}"
        status_code: "{{ grav_site_check_status }}"
        timeout: "{{ grav_site_check_timeout }}"
      register: _grav_site_check
      until: _grav_site_check.status | default(0) == grav_site_check_status
      retries: "{{ grav_site_check_retries }}"
      delay: "{{ grav_site_check_delay }}"

    - name: "Succès : retirer un éventuel diagnostic d'échec obsolète"
      ansible.builtin.import_tasks: clear_failure_diagnostic.yml

  rescue:
    - name: "Retenir le dernier statut de santé connu"
      ansible.builtin.set_fact:
        _grav_last_health: >-
          {{ (_grav_health_status.stdout | trim)
             if (_grav_health_status is defined
                 and (_grav_health_status.stdout | default('') | trim) != '')
             else '(inconnu)' }}

    # no_log : les logs du conteneur peuvent contenir des traces sensibles
    # (erreurs de démarrage recopiant l'environnement, bootstrap admin…).
    # Ils sont capturés puis écrits dans un fichier à accès restreint sur
    # l'hôte cible — jamais affichés dans la sortie Ansible.
    - name: "Capturer les derniers logs du conteneur (non affichés)"
      ansible.builtin.command:
        cmd: "docker logs --tail 200 {{ grav_container_name }}"
      register: _grav_failure_logs
      changed_when: false
      failed_when: false
      no_log: true

    - name: "Écrire les logs de diagnostic dans un fichier à accès restreint"
      ansible.builtin.copy:
        content: |
          # Diagnostic d'échec de déploiement — {{ grav_container_name }}
          # Référence     : {{ _grav_effective_reference }}
          # Statut santé  : {{ _grav_last_health }}
          # Contrôle HTTP : http://{{ _grav_site_check_host }}:{{ grav_http_port }}{{ grav_site_check_path }} (attendu {{ grav_site_check_status }})
          # --- docker logs --tail 200 ---
          {{ _grav_failure_logs.stdout | default('(logs indisponibles)') }}
          {{ _grav_failure_logs.stderr | default('') }}
        dest: "{{ grav_base_directory }}/.last_failure.log"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: "Échouer avec un message actionnable (sans divulguer les logs)"
      ansible.builtin.fail:
        msg: >-
          Déploiement de {{ _grav_effective_reference }} en échec : le
          conteneur {{ grav_container_name }} n'a pas atteint l'état
          "healthy" (dernier statut Docker : {{ _grav_last_health }}) ou la
          page {{ grav_site_check_path }} n'a pas répondu
          {{ grav_site_check_status }}. Les 200 dernières lignes de logs du
          conteneur ont été écrites dans
          {{ grav_base_directory }}/.last_failure.log (mode 0600, root) sur
          l'hôte cible : consultez ce fichier puis supprimez-le. Diagnostic
          complémentaire : « docker ps -a » et
          « docker inspect {{ grav_container_name }} ».
