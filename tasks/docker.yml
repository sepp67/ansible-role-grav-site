---
# Installation de Docker Engine + du plugin Docker Compose v2, via le dépôt
# officiel Docker. Périmètre volontairement limité à Debian/Ubuntu (voir
# README.md "Systèmes supportés").

# Seul consommateur de facts du rôle (os_family/distribution/
# distribution_release/architecture, ci-dessous et dans les tâches
# suivantes). Ciblé et conditionnel : ne gathère que si l'appelant a
# tourné en gather_facts:false (ou un gather_facts filtré n'ayant pas
# retenu ces clés) — un appelant en gather_facts:true par défaut n'est
# jamais re-gathered ici (audit privilèges 2026-09 : ce fichier dépendait
# silencieusement de facts jamais garantis par le rôle lui-même).
- name: "Collecter les faits système minimaux si absents (compatible gather_facts: false)"
  ansible.builtin.setup:
    gather_subset:
      - "!all"
      - "!min"
      - "distribution"
      - "hardware"
  when: ansible_facts['os_family'] is not defined

- name: "Vérifier que la famille d'OS est supportée (Debian/Ubuntu)"
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'Debian'
    fail_msg: >-
      Ce rôle ne sait installer Docker que sur Debian/Ubuntu
      (ansible_os_family=Debian). Sur un autre OS, désactivez
      grav_manage_docker et installez Docker Engine + le plugin Docker
      Compose vous-même avant d'appliquer ce rôle.
    quiet: true

- name: "Installer les paquets prérequis"
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: "Vérifier que l'architecture est supportée (x86_64, aarch64)"
  ansible.builtin.assert:
    that:
      - ansible_facts['architecture'] in ['x86_64', 'aarch64']
    fail_msg: >-
      Architecture non supportée pour l'installation automatique de Docker :
      "{{ ansible_facts['architecture'] }}". Seules x86_64 et aarch64 sont
      prises en charge par ce rôle. Sur une autre architecture, désactivez
      grav_manage_docker et installez Docker Engine + le plugin Docker
      Compose vous-même.
    quiet: true

- name: "Déterminer l'architecture du dépôt APT Docker"
  ansible.builtin.set_fact:
    _grav_docker_apt_arch: >-
      {{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts['architecture']] }}

- name: "Créer le répertoire des trousseaux APT"
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: "Télécharger la clé GPG officielle Docker"
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
    force: false

- name: "Déclarer le dépôt APT officiel Docker"
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ _grav_docker_apt_arch }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}
      {{ ansible_facts['distribution_release'] }} stable
    filename: docker
    state: present
  register: _grav_docker_repo_added

# Rafraîchissement immédiat requis avant la tâche d'installation suivante
# dans ce même fichier ; un handler différerait le rafraîchissement à la fin
# du play, trop tard pour la tâche qui suit.
- name: "Rafraîchir le cache APT après ajout du dépôt Docker"  # noqa: no-handler
  ansible.builtin.apt:
    update_cache: true
  when: _grav_docker_repo_added.changed

- name: "Installer Docker Engine et le plugin Docker Compose"
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present

- name: "S'assurer que le service Docker est démarré et activé"
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true
