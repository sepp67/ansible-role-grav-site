---
# Enregistre l'état de déploiement effectif, validé par le healthcheck.
# Purement documentaire : ne pilote aucune logique du rôle. Une mise à jour
# ou un rollback consistent simplement à rejouer le rôle avec une autre
# référence (grav_version et/ou grav_digest).

# Horodatage : source de temps INDÉPENDANTE de gather_facts (contrat v1.0.1
# §11.6). now() est un global Jinja d'Ansible (heure du contrôleur, UTC).
# now() se réévalue à chaque appel : on le fige ici une fois pour toute la
# durée de l'invocation du rôle (le journal des déploiements en dépend).
- name: "Figer l'horodatage du déploiement"
  ansible.builtin.set_fact:
    _grav_deployed_at: "{{ now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ') }}"

# Lire l'état contractuel PRÉCÉDENT avant d'écrire le nouveau, pour décider
# si le journal doit gagner une ligne. Le changement est détecté sur
# l'ÉTAT CONTRACTUEL (declared_version + référence effective), pas seulement
# sur la référence Docker : une nouvelle version derrière un digest
# identique (ex. 1.0.7 -> 1.0.8, même sha256) doit être journalisée.
- name: "Lire l'état de déploiement précédent (le cas échéant)"
  ansible.builtin.slurp:
    path: "{{ grav_base_directory }}/.deployed_state.yml"
  register: _grav_prev_state_raw
  failed_when: false

- name: "Analyser l'état précédent"
  ansible.builtin.set_fact:
    _grav_prev_state: >-
      {{ (_grav_prev_state_raw.content | b64decode | from_yaml)
         if (_grav_prev_state_raw.content is defined
             and (_grav_prev_state_raw.content | b64decode | trim | length) > 0)
         else {} }}

- name: "Déterminer si l'état contractuel a changé"
  ansible.builtin.set_fact:
    _grav_state_changed: >-
      {{ _grav_prev_state.get('declared_version', '') != (grav_version | string)
         or _grav_prev_state.get('digest', '') != grav_digest
         or _grav_prev_state.get('effective_reference', '') != _grav_effective_reference }}

# Propriétaire volontairement NON forcé sur les 3 fichiers de traçabilité
# ci-dessous (audit privilèges 2026-09, contrat v2.0.1) : contrairement à
# grav_base_directory/secrets/grav.env (données sensibles ou montées dans
# le conteneur), ces fichiers sont de la métadonnée de déploiement sans
# enjeu de sécurité — leur propriétaire reste l'utilisateur Ansible
# effectif (root pour une invocation complète du rôle, soumise à
# tasks/privilege_guard.yml ; l'utilisateur de test pour un rejeu isolé de
# CE SEUL fichier via `tasks_from: version`, comme tests/test_traceability.yml,
# qui n'a jamais eu besoin de root et ne doit pas en dépendre).
#
# .deployed_version : une ligne, la référence Docker EFFECTIVE actuellement
# déployée ("image:version" sans digest, "image@digest" avec). Artefact de
# compatibilité — ne pilote plus aucune détection.
- name: "Enregistrer la référence effective actuellement déployée"
  ansible.builtin.copy:
    content: |
      {{ _grav_effective_reference }}
    dest: "{{ grav_base_directory }}/.deployed_version"
    mode: "0644"

# .deployed_state.yml : vue structurée (contrat v1.0.1 §13.1). Écrit à
# chaque passage. deployed_at change à chaque déploiement — c'est voulu :
# ce fichier reflète l'état COURANT, pas un historique.
- name: "Enregistrer l'état de déploiement structuré (.deployed_state.yml)"
  ansible.builtin.template:
    src: deployed_state.yml.j2
    dest: "{{ grav_base_directory }}/.deployed_state.yml"
    mode: "0644"

# Journal append-only : une ligne UNIQUEMENT quand l'état contractuel change
# (declared_version, digest ou référence effective) — jamais sur un
# redéploiement strictement identique ni un simple grav_state: restarted.
#
# Lecture + réécriture complète (slurp puis copy) plutôt que lineinfile :
# lineinfile déduplique par CONTENU EXACT de ligne. slurp+copy s'exécutent
# tous deux sur l'hôte cible (jamais le contrôleur, indispensable pour un
# déploiement distant) et n'interpolent aucune valeur dans un shell : aucun
# risque d'injection.
# noqa: no-handler — doit s'exécuter immédiatement pour que tests/test.yml
# puisse vérifier le journal entre chaque inclusion du rôle dans le même play.
- name: "Lire le journal des déploiements existant"  # noqa: no-handler
  ansible.builtin.slurp:
    path: "{{ grav_base_directory }}/deployed_versions.log"
  register: _grav_existing_log
  when: _grav_state_changed | bool
  failed_when: false

- name: "Extraire le contenu existant du journal"  # noqa: no-handler
  ansible.builtin.set_fact:
    _grav_existing_log_content: "{{ _grav_existing_log.content | default('') | b64decode }}"
  when: _grav_state_changed | bool

- name: "Ajouter l'état contractuel au journal des déploiements"  # noqa: no-handler
  ansible.builtin.copy:
    content: "{{ _grav_existing_log_content }}{{ _grav_deployed_at }} {{ grav_version }} {{ _grav_effective_reference }}\n"
    dest: "{{ grav_base_directory }}/deployed_versions.log"
    mode: "0644"
  when: _grav_state_changed | bool
