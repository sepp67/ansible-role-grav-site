---
# Enregistre l'état de déploiement effectif, validé par le healthcheck.
# Purement documentaire : ne pilote aucune logique du rôle. Une mise à jour
# ou un rollback consistent simplement à rejouer le rôle avec une autre
# référence (grav_version et/ou grav_digest).

# Horodatage : source de temps INDÉPENDANTE de gather_facts (contrat v1.0.1
# §11.6). now() est un global Jinja d'Ansible (heure du contrôleur, UTC).
# now() se réévalue à chaque appel : on le fige ici une fois pour toute la
# durée de l'invocation du rôle (le journal des déploiements en dépend).
- name: "Figer l'horodatage du déploiement"
  ansible.builtin.set_fact:
    _grav_deployed_at: "{{ now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ') }}"

# .deployed_version : une ligne, la référence Docker EFFECTIVE actuellement
# déployée ("image:version" sans digest, "image@digest" avec). Sert de
# marqueur de changement pour le journal ci-dessous — change dès que la
# version OU le digest change.
- name: "Enregistrer la référence effective actuellement déployée"
  ansible.builtin.copy:
    content: |
      {{ _grav_effective_reference }}
    dest: "{{ grav_base_directory }}/.deployed_version"
    mode: "0644"
  register: _grav_version_marker

# .deployed_state.yml : vue structurée (contrat v1.0.1 §13.1). Écrit à
# chaque passage ; idempotent (aucun changement si le contenu est
# identique). deployed_at change à chaque déploiement — c'est voulu :
# ce fichier reflète l'état courant, pas un historique.
- name: "Enregistrer l'état de déploiement structuré (.deployed_state.yml)"
  ansible.builtin.template:
    src: deployed_state.yml.j2
    dest: "{{ grav_base_directory }}/.deployed_state.yml"
    mode: "0644"

# Journal append-only : une ligne UNIQUEMENT quand la référence effective
# change (marqueur ci-dessus effectivement modifié) — jamais sur un
# redéploiement identique ni un simple grav_state: restarted.
#
# Lecture + réécriture complète (slurp puis copy) plutôt que lineinfile :
# lineinfile déduplique par CONTENU EXACT de ligne — un rollback vers une
# référence déjà vue (ex. A -> B -> A) produirait, si l'horodatage était
# figé, une ligne identique à une entrée passée, et lineinfile refuserait
# silencieusement de l'ajouter (constaté en test, voir tests/_verify_phase.yml).
# slurp+copy s'exécutent tous deux sur l'hôte cible (jamais le contrôleur,
# indispensable pour un déploiement distant) et n'interpolent aucune valeur
# dans un shell : aucun risque d'injection.
# noqa: no-handler — doit s'exécuter immédiatement pour que tests/test.yml
# puisse vérifier le journal entre chaque inclusion du rôle dans le même play.
- name: "Lire le journal des déploiements existant"  # noqa: no-handler
  ansible.builtin.slurp:
    path: "{{ grav_base_directory }}/deployed_versions.log"
  register: _grav_existing_log
  when: _grav_version_marker.changed
  failed_when: false

- name: "Extraire le contenu existant du journal"  # noqa: no-handler
  ansible.builtin.set_fact:
    _grav_existing_log_content: "{{ _grav_existing_log.content | default('') | b64decode }}"
  when: _grav_version_marker.changed

- name: "Ajouter la référence effective au journal des déploiements"  # noqa: no-handler
  ansible.builtin.copy:
    content: "{{ _grav_existing_log_content }}{{ _grav_deployed_at }} {{ _grav_effective_reference }}\n"
    dest: "{{ grav_base_directory }}/deployed_versions.log"
    mode: "0644"
  when: _grav_version_marker.changed
