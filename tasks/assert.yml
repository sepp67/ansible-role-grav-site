---
# Validation précoce : échouer côté Ansible avec un message clair plutôt que
# de laisser le conteneur refuser de démarrer (le runtime applique la même
# politique tri-state sur le bootstrap admin, voir grav-runtime README
# "Bootstrap administrateur").

- name: "Vérifier que l'identité de l'application déployée est renseignée"
  ansible.builtin.assert:
    that:
      - grav_image | length > 0
      - grav_version | length > 0
    fail_msg: >-
      grav_image et grav_version sont obligatoires : ce sont les deux seules
      variables qui identifient l'application déployée (ex. grav_image=
      "ghcr.io/sepp67/projet-gites", grav_version="1.0.0").
    quiet: true

- name: "Interdire le tag 'latest'"
  ansible.builtin.assert:
    that:
      - grav_version != 'latest'
    fail_msg: >-
      grav_version ne doit jamais être "latest" en production — une image
      applicative épingle toujours une version explicite (voir le README de
      grav-runtime, section "Versionnement"). Utilisez un tag précis
      (ex. "1.0.0").
    quiet: true

# grav_image ne doit contenir ni tag final ni digest incorporé (c'est le
# rôle de grav_version, et de grav_digest à partir du Lot 4) — le port d'un
# registre privé reste explicitement autorisé (contrat v1.0.1 §5.4), ex.
# "registry.example.net:5000/projet-grav". Algorithme : un digest ("@") est
# toujours refusé ; un ":" n'est un tag interdit que s'il apparaît APRÈS le
# premier "/" (dans le chemin du dépôt) — ou n'importe où si grav_image ne
# contient aucun "/" (nom nu, pas de registre).
- name: "Décomposer grav_image pour validation"
  ansible.builtin.set_fact:
    _grav_image_has_slash: "{{ '/' in grav_image }}"
    _grav_image_path_part: "{{ grav_image.split('/', 1)[1] if '/' in grav_image else grav_image }}"

- name: "Valider grav_image (registre avec port autorisé, tag/digest incorporé refusé)"
  ansible.builtin.assert:
    that:
      - "'@' not in grav_image"
      - "':' not in _grav_image_path_part"
    fail_msg: >-
      grav_image="{{ grav_image }}" invalide : ne doit contenir ni tag final
      (ex. ":1.0.0" — utilisez grav_version) ni digest (ex. "@sha256:…").
      Un port de registre reste autorisé avant le premier "/", ex.
      "registry.example.net:5000/projet-grav".
    quiet: true

# grav_digest : épinglage immuable OPTIONNEL (contrat v1.0.1 §5). Vide ou
# "sha256:" + 64 hexadécimaux minuscules. grav_version reste obligatoire
# (asserté plus haut) même lorsqu'un digest est fourni.
- name: "Valider grav_digest"
  ansible.builtin.assert:
    that:
      - grav_digest | length == 0 or grav_digest is match('^sha256:[0-9a-f]{64}$')
    fail_msg: >-
      grav_digest="{{ grav_digest }}" invalide : doit être vide, ou "sha256:"
      suivi de 64 caractères hexadécimaux minuscules. Voir docs/MIGRATION.md
      §4.
    quiet: true

- name: "Valider le nom de conteneur (grav_container_name)"
  ansible.builtin.assert:
    that:
      - grav_container_name is regex('^[A-Za-z0-9][A-Za-z0-9._-]*$')
      - "'..' not in grav_container_name"
      - "'/' not in grav_container_name"
      - "':' not in grav_container_name"
    fail_msg: >-
      grav_container_name="{{ grav_container_name }}" invalide : doit
      commencer par un caractère alphanumérique et ne contenir que des
      lettres, chiffres, ".", "_" ou "-" — jamais "..", "/" ni ":".
    quiet: true

- name: "Valider grav_state"
  ansible.builtin.assert:
    that:
      - grav_state in ['started', 'stopped', 'restarted']
    fail_msg: >-
      grav_state="{{ grav_state }}" invalide : doit être 'started',
      'stopped' ou 'restarted'.
    quiet: true

- name: "Valider grav_http_port"
  ansible.builtin.assert:
    that:
      - grav_http_port | int >= 1
      - grav_http_port | int <= 65535
    fail_msg: >-
      grav_http_port="{{ grav_http_port }}" invalide : doit être un port TCP
      valide (1-65535).
    quiet: true

# grav_bind_address est OBLIGATOIRE depuis la v2.0.0 (contrat v1.0.1 §7.1) :
# aucun défaut implicite, l'appelant doit exprimer son intention.
- name: "Vérifier que grav_bind_address est renseignée"
  ansible.builtin.assert:
    that:
      - grav_bind_address | length > 0
    fail_msg: >-
      grav_bind_address est obligatoire (contrat v1.0.1 §7.1) : indiquez
      l'adresse d'écoute explicite de cette instance — "127.0.0.1" (usage
      local), l'adresse LAN de la VM (ex. "192.168.1.10"), ou "0.0.0.0"
      (toutes les interfaces, choix assumé). Voir README.md "Contrat réseau".
    quiet: true

# Forme de grav_bind_address. v2.0.0 valide et supporte UNIQUEMENT l'IPv4
# littérale (ou "0.0.0.0"). Validation stricte : chaque octet 0-255, sans
# zéro initial, exactement 4 octets. L'IPv6 (dont "::") est REFUSÉE : une
# validation IPv6 fiable exigerait ansible.utils + netaddr (dépendances
# disproportionnées pour ce rôle) — voir docs/MIGRATION.md. Une chaîne
# contenant ":" n'est donc jamais considérée comme une adresse valide.
- name: "Valider la forme de grav_bind_address (IPv4 uniquement en v2.0.0)"
  ansible.builtin.assert:
    that:
      - >-
        grav_bind_address == '0.0.0.0'
        or grav_bind_address is match('^(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])(\.(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])){3}$')
    fail_msg: >-
      grav_bind_address="{{ grav_bind_address }}" invalide : v2.0.0 supporte
      uniquement une adresse IPv4 littérale (octets 0-255, sans zéro initial)
      ou "0.0.0.0". L'IPv6 (dont "::") n'est pas prise en charge à ce stade —
      liez l'instance à une adresse IPv4 et laissez le reverse proxy gérer
      l'IPv6. Un nom d'hôte est également refusé. Voir docs/MIGRATION.md.
    quiet: true

- name: "Valider grav_healthcheck_retries et grav_deploy_wait_retries"
  ansible.builtin.assert:
    that:
      - grav_healthcheck_retries | int > 0
      - grav_deploy_wait_retries | int > 0
    fail_msg: >-
      grav_healthcheck_retries ({{ grav_healthcheck_retries }}) et
      grav_deploy_wait_retries ({{ grav_deploy_wait_retries }}) doivent être
      des entiers strictement positifs.
    quiet: true

# grav_site_check_host : vide par défaut (dérivé de grav_bind_address, voir
# vars/main.yml). Un override explicite reste possible mais ne doit pas
# contenir ":" — ni IPv6 (non pris en charge en v2.0.0, cf. plus haut), ni
# numéro de port (le port vient de grav_http_port). L'adresse effectivement
# contrôlée (_grav_site_check_host) doit toujours être non vide.
- name: "Valider grav_site_check_host (override) et grav_site_check_path"
  ansible.builtin.assert:
    that:
      - "':' not in grav_site_check_host"
      - _grav_site_check_host | length > 0
      - grav_site_check_path is match('/')
    fail_msg: >-
      grav_site_check_host="{{ grav_site_check_host }}" invalide : laissez-la
      vide (dérivation automatique depuis grav_bind_address) ou fournissez un
      hôte/IPv4 sans ":" (l'IPv6 n'est pas prise en charge en v2.0.0, le port
      vient de grav_http_port). grav_site_check_path doit commencer par "/"
      (actuellement "{{ grav_site_check_path }}").
    quiet: true

# Dépréciation (contrat v1.0.1 §6.3, décision Q2 du préflight) : la
# surcharge directe des 5 chemins persistants reste ACCEPTÉE et HONORÉE en
# v2.0.0 — jamais silencieusement ignorée. Un avertissement n'est émis QUE
# si la valeur diffère du chemin normalement dérivé de grav_base_directory ;
# le chemin dérivé normal ne produit aucun avertissement. Retrait éventuel
# en v3.0.0 — voir docs/MIGRATION.md §5.
- name: "Comparer les chemins persistants fournis aux chemins normalement dérivés"
  ansible.builtin.set_fact:
    _grav_directory_checks:
      - {name: grav_pages_directory, actual: "{{ grav_pages_directory }}", expected: "{{ grav_base_directory }}/data/pages"}
      - {name: grav_accounts_directory, actual: "{{ grav_accounts_directory }}", expected: "{{ grav_base_directory }}/data/accounts"}
      - {name: grav_data_directory, actual: "{{ grav_data_directory }}", expected: "{{ grav_base_directory }}/data/data"}
      - {name: grav_images_directory, actual: "{{ grav_images_directory }}", expected: "{{ grav_base_directory }}/data/images"}
      - {name: grav_secret_directory, actual: "{{ grav_secret_directory }}", expected: "{{ grav_base_directory }}/secrets"}

- name: "Avertir si un chemin persistant est surchargé explicitement (déprécié)"
  ansible.builtin.debug:
    msg: >-
      [DEPRECATED] {{ item.name }}="{{ item.actual }}" diffère du chemin
      normalement dérivé de grav_base_directory ("{{ item.expected }}"). La
      surcharge directe de ce chemin est dépréciée et sera retirée en
      v3.0.0 — voir docs/MIGRATION.md §5. Cette valeur reste honorée telle
      quelle dans cette version.
  loop: "{{ _grav_directory_checks }}"
  when: item.actual != item.expected
  loop_control:
    label: "{{ item.name }}"

- name: "Calculer le nombre de variables admin renseignées"
  ansible.builtin.set_fact:
    _grav_admin_vars_set: >-
      {{ ([grav_admin_user, grav_admin_password, grav_admin_email]
          | reject('equalto', '') | list | length) | int }}

- name: "Vérifier la politique tri-state des identifiants admin (grav-runtime)"
  ansible.builtin.assert:
    that:
      - _grav_admin_vars_set | int == 0 or _grav_admin_vars_set | int == 3
    fail_msg: >-
      grav_admin_user, grav_admin_password et grav_admin_email doivent être
      soit toutes les trois définies (bootstrap admin activé), soit toutes
      les trois absentes (bootstrap désactivé) — c'est la politique
      appliquée par grav-runtime lui-même ; un état partiel ferait échouer
      le démarrage du conteneur.
    quiet: true

- name: "Valider grav_admin_type"
  ansible.builtin.assert:
    that:
      - grav_admin_type in ['', 'admin', 'api', 'both']
    fail_msg: >-
      grav_admin_type="{{ grav_admin_type }}" invalide : doit être vide (le
      runtime choisit "both" par défaut), "admin", "api" ou "both" — voir
      README.md "Contrat avec grav-runtime".
    quiet: true

# grav_extra_environment (contrat v1.0.1 §6.5) : échappatoire générique vers
# de futures variables grav-runtime. Ses clés sont validées et ne peuvent
# jamais écraser silencieusement une variable que le rôle gère déjà
# explicitement (sinon un GRAV_ADMIN_USER glissé ici court-circuiterait la
# politique tri-state ci-dessus sans jamais passer par assert.yml).
- name: "Lister les clés déjà gérées explicitement par le rôle"
  ansible.builtin.set_fact:
    _grav_reserved_env_keys:
      - GRAV_ADMIN_USER
      - GRAV_ADMIN_PASSWORD
      - GRAV_ADMIN_EMAIL
      - GRAV_ADMIN_FULLNAME
      - GRAV_ADMIN_TITLE
      - GRAV_ADMIN_LANGUAGE
      - GRAV_ADMIN_TYPE
      - GRAV_TIMEZONE

- name: "Valider les clés de grav_extra_environment"
  ansible.builtin.assert:
    that:
      - item is match('^GRAV_[A-Z0-9_]+$')
      - item not in _grav_reserved_env_keys
    fail_msg: >-
      Clé grav_extra_environment="{{ item }}" invalide : doit correspondre à
      ^GRAV_[A-Z0-9_]+$ et ne peut pas écraser une variable déjà gérée
      explicitement par le rôle ({{ _grav_reserved_env_keys | join(', ') }}).
    quiet: true
  loop: "{{ grav_extra_environment.keys() | list }}"
  loop_control:
    label: "{{ item }}"

# Rassemble toutes les valeurs qui finissent dans grav.env (voir
# templates/grav.env.j2) : même en format `raw`, une ligne = une variable —
# un retour à la ligne dans une valeur couperait/corromprait le fichier.
- name: "Rassembler les valeurs destinées à grav.env"
  ansible.builtin.set_fact:
    _grav_env_values: >-
      {{ [grav_admin_user, grav_admin_password, grav_admin_email,
          grav_admin_fullname, grav_admin_title, grav_admin_language,
          grav_admin_type, grav_timezone] + (grav_extra_environment.values() | list) }}
  no_log: true

- name: "Interdire les retours à la ligne dans les valeurs destinées à grav.env"
  ansible.builtin.assert:
    that:
      - "'\n' not in (item | string)"
      - "'\r' not in (item | string)"
    fail_msg: >-
      Une valeur destinée à grav.env (grav_admin_*, grav_timezone ou
      grav_extra_environment) contient un retour à la ligne — interdit, une
      ligne de grav.env ne peut contenir qu'une seule variable.
    quiet: true
  loop: "{{ _grav_env_values }}"
  loop_control:
    label: "(valeur masquée)"
  no_log: true
