---
- name: "Converge — installation de Docker via tasks/docker.yml (T02)"
  hosts: all
  gather_facts: true

  tasks:
    # Le contrôle « pas de Docker au départ » (contrainte 1) n'a de sens qu'au
    # PREMIER converge : la passe d'idempotence de Molecule (T03) le saute
    # (tag molecule-idempotence-notest), Docker étant alors déjà installé.
    - name: "Constater l'état initial : Docker Engine absent"
      ansible.builtin.command: "docker version"
      register: _grav_pre_docker
      changed_when: false
      failed_when: false
      tags: [molecule-idempotence-notest]

    - name: "Prérequis T02 — le système de départ n'a pas Docker (contrainte 1)"
      ansible.builtin.assert:
        that:
          - _grav_pre_docker.rc != 0
        fail_msg: >-
          Docker Engine est déjà présent sur ce conteneur : T02 doit partir
          d'un environnement où Docker n'est pas installé.
        quiet: true
      tags: [molecule-idempotence-notest]

    # Rôle résolu par chemin absolu (molecule expose MOLECULE_PROJECT_DIRECTORY),
    # comme les playbooks/ du dépôt — voir README.md "Résolution du rôle".
    - name: "Installer Docker Engine + le plugin Compose (tasks/docker.yml)"  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
        tasks_from: docker
