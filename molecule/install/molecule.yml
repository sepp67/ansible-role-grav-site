---
# Scénario molecule "install" — T02 / T03 (contrat v1.0.1 §10, §17).
#
# Installe Docker Engine + le plugin Compose v2 via tasks/docker.yml sur un
# conteneur systemd SANS Docker préinstallé, sur les trois plateformes
# officiellement supportées par 2.0.0. `idempotence` couvre T03.
#
# Conteneurs privilégiés + systemd (geerlingguy/*-ansible) : requis parce
# que tasks/docker.yml se termine par `systemd: name=docker state=started`.
# Ils sont détruits par `molecule destroy` (toujours joué en fin de
# séquence, y compris sur échec).

role_name_check: 1

driver:
  name: docker

platforms:
  - name: grav-l7-install-debian12
    image: geerlingguy/docker-debian12-ansible@sha256:a906d69671f93666731d196add52a2447966303d8bc398da8fd01bdb543909dc
    command: /usr/lib/systemd/systemd
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock
    pre_build_image: true
  - name: grav-l7-install-ubuntu2204
    image: geerlingguy/docker-ubuntu2204-ansible@sha256:9dea87fba8ef05c32a68d03443f171362c191b528e277a01a28cb1c1d7c20b8c
    command: /usr/lib/systemd/systemd
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock
    pre_build_image: true
  - name: grav-l7-install-ubuntu2404
    image: geerlingguy/docker-ubuntu2404-ansible@sha256:625d7dfdad134fd25c28873a8b8b81c4907ecb57c66f20e9b599582ef376b46c
    command: /usr/lib/systemd/systemd
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock
    pre_build_image: true

provisioner:
  name: ansible

dependency:
  name: galaxy
  enabled: false

scenario:
  name: install
  test_sequence:
    - destroy
    - create
    - converge
    - idempotence
    - verify
    - destroy
