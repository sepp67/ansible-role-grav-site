---
# Scénario molecule "digest" — T19, T20, T23 (contrat v1.0.1 §5.3, §13, §11.6).
#
#   T19 : déploiement par digest (grav_image@sha256:…) — l'instance tourne
#         EXACTEMENT l'image épinglée ; jamais de pseudo-référence
#         image:version@digest.
#   T20 : traçabilité structurée vérifiée sur un déploiement RÉEL
#         (.deployed_state.yml, journal append-only, bump de version derrière
#         le même digest). La matrice exhaustive (rollback A→B→A, changement
#         de digest) reste couverte hors Docker par tests/test_traceability.yml.
#   T23 : converge entier joué avec gather_facts: false — la traçabilité et
#         le déploiement fonctionnent sans facts (deployed_at renseigné par
#         une source de temps indépendante).
#
# Docker-in-Docker (Debian 12, privilégié, systemd, storage-driver vfs).

role_name_check: 1

driver:
  name: docker

platforms:
  - name: grav-l8-digest-debian12
    image: geerlingguy/docker-debian12-ansible@sha256:a906d69671f93666731d196add52a2447966303d8bc398da8fd01bdb543909dc
    command: /usr/lib/systemd/systemd
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock
    pre_build_image: true

provisioner:
  name: ansible

dependency:
  name: galaxy
  enabled: false

scenario:
  name: digest
  test_sequence:
    - destroy
    - create
    - prepare
    - converge
    - verify
    - destroy
