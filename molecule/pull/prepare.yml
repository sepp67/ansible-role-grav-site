---
- name: "Prepare — Docker-in-Docker + référence d'image purement locale"
  hosts: all
  gather_facts: true

  vars:
    _grav_l7_runtime_ref: "ghcr.io/sepp67/grav-runtime"
    _grav_l7_version: "1.0.4"
    # Référence qui n'existe DANS AUCUN registre : toute consultation de
    # registre à son sujet échouerait (DNS non résolu). Utilisée par T17
    # (preuve d'absence de consultation) et T18b (échec attribuable au pull).
    _grav_l7_local_ref: "local-only.test/grav-runtime"
    _grav_l7_local_tag: "pinned"

  tasks:
    - name: "Créer /etc/docker"
      ansible.builtin.file:
        path: /etc/docker
        state: directory
        mode: "0755"

    - name: "Forcer le storage-driver vfs pour le daemon imbriqué"
      ansible.builtin.copy:
        content: |
          {
            "storage-driver": "vfs"
          }
        dest: /etc/docker/daemon.json
        mode: "0644"

    - name: "Installer Docker Engine dans le conteneur de test (tasks/docker.yml)"  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
        tasks_from: docker

    - name: "Attendre le daemon Docker imbriqué (vfs)"
      ansible.builtin.command: "docker info --format '{{ '{{' }}.Driver{{ '}}' }}'"
      register: _grav_l7_dind
      until: _grav_l7_dind.rc == 0 and (_grav_l7_dind.stdout | trim) == 'vfs'
      retries: 20
      delay: 2
      changed_when: false

    - name: "Tirer l'image grav-runtime réelle dans le daemon imbriqué"
      ansible.builtin.command: "docker pull {{ _grav_l7_runtime_ref }}:{{ _grav_l7_version }}"
      changed_when: true

    - name: "Créer une référence PUREMENT LOCALE (aucun registre)"
      ansible.builtin.command:
        cmd: >-
          docker tag {{ _grav_l7_runtime_ref }}:{{ _grav_l7_version }}
          {{ _grav_l7_local_ref }}:{{ _grav_l7_local_tag }}
      changed_when: true

    - name: "Vérifier que la référence locale n'est pas résolvable comme registre"
      ansible.builtin.command:
        argv:
          - getent
          - hosts
          - local-only.test
      register: _grav_l7_dns
      changed_when: false
      failed_when: false

    - name: "Confirmer : 'local-only.test' n'a aucune résolution DNS"
      ansible.builtin.assert:
        that:
          - _grav_l7_dns.rc != 0
        fail_msg: "local-only.test se résout — la preuve d'absence de consultation du registre serait invalide."
        quiet: true
