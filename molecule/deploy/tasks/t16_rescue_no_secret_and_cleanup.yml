---
# T16 — chemin d'échec du healthcheck :
#   - .last_failure.log créé en 0600 root:root ;
#   - AUCUN secret ni log de conteneur dans la sortie Ansible (vérifié en
#     capturant réellement la sortie d'un ansible-playbook sous-processus) ;
#   - au retour au vert, .last_failure.log est supprimé.

- name: "T16 — répertoire neuf"
  ansible.builtin.file:
    path: /opt/grav-t16
    state: absent

- name: "T16 — mot de passe fictif dédié (marqueur d'audit)"
  ansible.builtin.set_fact:
    _t16_pw: "molt16-{{ lookup('ansible.builtin.password', '/dev/null length=22 chars=ascii_letters,digits') }}"
  no_log: true

- name: "T16 — déploiement voué à l'échec HTTP (via ansible-playbook, sortie capturée)"
  ansible.builtin.command:
    argv:
      - ansible-playbook
      - "/opt/inner_deploy.yml"
      - "-e"
      - "grav_l7_role=/opt/grav-role"
      - "-e"
      - "target_base=/opt/grav-t16"
      - "-e"
      - "target_name=grav-t16"
      - "-e"
      - "target_port=18160"
      - "-e"
      - "target_image={{ grav_l7_image }}"
      - "-e"
      - "target_version={{ grav_l7_version }}"
      - "-e"
      - "target_admin_user=mol-t16"
      - "-e"
      - "target_admin_email=mol-t16@molecule.test"
      - "-e"
      - "target_admin_password={{ _t16_pw }}"
      - "-e"
      - "target_check_path=/molecule-this-path-does-not-exist"
      - "-e"
      - "target_check_retries=1"
  environment:
    ANSIBLE_FORCE_COLOR: "0"
    ANSIBLE_NOCOLOR: "1"
  register: _t16_run
  changed_when: true
  failed_when: false
  no_log: true

- name: "T16 — le déploiement a bien échoué"
  ansible.builtin.assert:
    that:
      - _t16_run.rc != 0
    fail_msg: "T16 : le déploiement piégé aurait dû échouer (contrôle HTTP 404)."
    quiet: true

- name: "T16 — état de .last_failure.log"
  ansible.builtin.stat:
    path: /opt/grav-t16/.last_failure.log
  register: _t16_flog

- name: "T16 — assertions : fichier de diagnostic correct, sortie sans secret"
  ansible.builtin.assert:
    that:
      - _t16_flog.stat.exists
      - _t16_flog.stat.mode == '0600'
      - _t16_flog.stat.pw_name == 'root'
      - _t16_flog.stat.gr_name == 'root'
      - _t16_pw not in (_t16_run.stdout | default(''))
      - _t16_pw not in (_t16_run.stderr | default(''))
      - "'GRAV_ADMIN_PASSWORD=' not in (_t16_run.stdout | default(''))"
    fail_msg: >-
      T16 : .last_failure.log absent/incorrect, ou un secret / GRAV_ADMIN_PASSWORD
      apparaît dans la sortie Ansible du déploiement en échec.
    success_msg: >-
      T16 OK — .last_failure.log 0600 root:root ; le mot de passe fictif et
      GRAV_ADMIN_PASSWORD n'apparaissent nulle part dans la sortie.
    quiet: true
  no_log: true

- name: "T16 — redéploiement correct (chemin HTTP valide)"  # noqa: role-name[path]
  ansible.builtin.include_role:
    name: "{{ grav_l7_role }}"
  vars:
    grav_manage_docker: false
    grav_image: "{{ grav_l7_image }}"
    grav_version: "{{ grav_l7_version }}"
    grav_container_name: "grav-t16"
    grav_base_directory: /opt/grav-t16
    grav_bind_address: "127.0.0.1"
    grav_http_port: 18160
    grav_site_check_path: "{{ grav_l7_check_path }}"
    grav_admin_user: "mol-t16"
    grav_admin_password: "{{ _t16_pw }}"
    grav_admin_email: "mol-t16@molecule.test"

- name: "T16 — .last_failure.log après le retour au vert"
  ansible.builtin.stat:
    path: /opt/grav-t16/.last_failure.log
  register: _t16_flog2

- name: "T16 — assertion cycle de vie"
  ansible.builtin.assert:
    that:
      - not _t16_flog2.stat.exists
    fail_msg: "T16 : .last_failure.log n'a pas été supprimé après un déploiement sain."
    success_msg: "T16 OK — .last_failure.log supprimé au retour au vert."
    quiet: true

- name: "T16 — teardown"
  ansible.builtin.include_tasks: _teardown.yml
  vars:
    _td_dir: /opt/grav-t16
