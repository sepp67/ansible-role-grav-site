---
# Arrête et supprime une instance de test (conteneur + volumes) puis efface
# son répertoire. `_td_dir` = grav_base_directory de l'instance.
- name: "Teardown : docker compose down -v ({{ _td_dir }})"
  ansible.builtin.command:
    cmd: "docker compose -f {{ _td_dir }}/docker-compose.yml down -v --remove-orphans"
  changed_when: true
  failed_when: false

- name: "Teardown : supprimer le répertoire d'instance ({{ _td_dir }})"
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - -v
      - "{{ _td_dir | dirname }}:/cleanup"
      - alpine
      - rm
      - -rf
      - "/cleanup/{{ _td_dir | basename }}"
  changed_when: true
  failed_when: false
