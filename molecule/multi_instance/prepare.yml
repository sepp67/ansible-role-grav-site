---
- name: "Prepare — Docker-in-Docker"
  hosts: all
  gather_facts: true

  tasks:
    - name: "Créer /etc/docker"
      ansible.builtin.file:
        path: /etc/docker
        state: directory
        mode: "0755"

    - name: "Forcer le storage-driver vfs (overlay imbriqué impossible)"
      ansible.builtin.copy:
        content: "{\n  \"storage-driver\": \"vfs\"\n}\n"
        dest: /etc/docker/daemon.json
        mode: "0644"

    - name: "Installer Docker Engine (tasks/docker.yml)"  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
        tasks_from: docker

    - name: "Attendre le daemon Docker imbriqué (vfs)"
      ansible.builtin.command: "docker info --format '{{ '{{' }}.Driver{{ '}}' }}'"
      register: _grav_l8_dind
      until: _grav_l8_dind.rc == 0 and (_grav_l8_dind.stdout | trim) == 'vfs'
      retries: 20
      delay: 2
      changed_when: false

    - name: "Tirer l'image applicative + résoudre son digest"
      ansible.builtin.command: "docker pull ghcr.io/sepp67/grav-runtime:1.0.4"
      changed_when: true

    - name: "Digest de l'image (pour l'instance A)"
      ansible.builtin.command:
        cmd: "docker inspect --format '{{ '{{' }}index .RepoDigests 0{{ '}}' }}' ghcr.io/sepp67/grav-runtime:1.0.4"
      register: _grav_l8_repodigest
      changed_when: false

    - name: "Persister le digest pour converge.yml"
      ansible.builtin.copy:
        dest: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/digest.yml"
        mode: "0644"
        content: |
          grav_l8_digest: "{{ _grav_l8_repodigest.stdout | trim | regex_replace('^.*@', '') }}"
      delegate_to: localhost
