---
# Scénario molecule "legacy" — exécution des tests Docker EN PLAYBOOK
# existants (tests/test.yml, test_env_encoding.yml, test_standalone.yml)
# dans un contexte ISOLÉ : un seul conteneur Docker-in-Docker (Debian 12).
#
# La workstation ne voit qu'un conteneur `molecule-*` ; tout le reste
# (daemon imbriqué, conteneurs grav-site-*, images, /tmp) vit dans ce
# conteneur et disparaît au `molecule destroy`.

role_name_check: 1

driver:
  name: docker

platforms:
  - name: grav-l7-legacy-debian12
    image: geerlingguy/docker-debian12-ansible:latest
    command: /usr/lib/systemd/systemd
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock
    pre_build_image: true

provisioner:
  name: ansible

dependency:
  name: galaxy
  enabled: false

scenario:
  name: legacy
  test_sequence:
    - destroy
    - create
    - prepare
    - converge
    - destroy
