---
- name: "Prepare — Docker-in-Docker + copie du dépôt pour les tests en playbook"
  hosts: all
  gather_facts: true

  vars:
    _grav_l7_runtime_ref: "ghcr.io/sepp67/grav-runtime"
    _grav_l7_versions: ["1.0.2", "1.0.3"]   # utilisées par tests/test.yml
    _grav_l7_repo: /opt/grav-repo

  tasks:
    - name: "Créer /etc/docker"
      ansible.builtin.file:
        path: /etc/docker
        state: directory
        mode: "0755"

    - name: "Forcer le storage-driver vfs (overlay imbriqué impossible)"
      ansible.builtin.copy:
        content: "{\n  \"storage-driver\": \"vfs\"\n}\n"
        dest: /etc/docker/daemon.json
        mode: "0644"

    - name: "Installer Docker Engine (tasks/docker.yml)"  # noqa: role-name[path]
      ansible.builtin.include_role:
        name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
        tasks_from: docker

    - name: "Attendre le daemon imbriqué (vfs)"
      ansible.builtin.command: "docker info --format '{{ '{{' }}.Driver{{ '}}' }}'"
      register: _grav_l7_dind
      until: _grav_l7_dind.rc == 0 and (_grav_l7_dind.stdout | trim) == 'vfs'
      retries: 20
      delay: 2
      changed_when: false

    - name: "Pré-tirer les images utilisées par les tests"
      ansible.builtin.command: "docker pull {{ _grav_l7_runtime_ref }}:{{ item }}"
      loop: "{{ _grav_l7_versions }}"
      changed_when: true

    - name: "Installer community.docker dans le conteneur (pour les tests)"
      ansible.builtin.command: "ansible-galaxy collection install 'community.docker:>=5.0.0,<6.0.0'"
      changed_when: true

    - name: "Créer la racine de la copie du dépôt"
      ansible.builtin.file:
        path: "{{ _grav_l7_repo }}"
        state: directory
        mode: "0755"

    # Copie via une seule archive (le module copy récursif est trop lent sur
    # une connexion docker). L'archive vit dans le répertoire éphémère de
    # Molecule (nettoyé automatiquement).
    - name: "Archiver les fichiers du dépôt nécessaires aux tests (sur le contrôleur)"  # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: >-
          tar czf {{ _grav_l7_tgz }}
          -C {{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}
          ansible.cfg defaults tasks templates vars meta playbooks tests
      delegate_to: localhost
      changed_when: true
      vars:
        _grav_l7_tgz: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/legacy-repo.tgz"

    - name: "Copier l'archive dans le conteneur"
      ansible.builtin.copy:
        src: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/legacy-repo.tgz"
        dest: /opt/legacy-repo.tgz
        mode: "0644"

    - name: "Extraire le dépôt dans le conteneur"
      ansible.builtin.unarchive:
        src: /opt/legacy-repo.tgz
        dest: "{{ _grav_l7_repo }}"
        remote_src: true
